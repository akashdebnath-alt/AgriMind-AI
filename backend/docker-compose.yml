services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: agrimind_db
      MYSQL_USER: agrimind
      MYSQL_PASSWORD: agrimind_password
      MYSQL_ROOT_PASSWORD: root_password
    ports: ["3306:3306"]
    volumes: ["dbdata:/var/lib/mysql", "./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://agrimind:agrimind_password@db:3306/agrimind_db
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  dbdata:
